{{> header}}
<div class="aggie-table-wrapper p-3">
    <h1 class="h3 aggie-section-title text-aggie mb-3">Scoreboard</h1>
    <table class="table table-hover table-striped aggie-table mb-0">
        <thead>
        <tr>
            <th scope="col">Score</th>
            <th scope="col">Player</th>
        </tr>
        </thead>
        <tbody>
        {{#scoreboardRows}}
            <tr>
                <td><span class="badge badge-aggie">{{playerScore}}</span></td>
                <td>{{playerName}}</td>
            </tr>
        {{/scoreboardRows}}
        </tbody>
    </table>
</div>
{{> footer}}
